[project]
name = "pfsense-mcp-server"
version = "0.1.0"
description = "Local MCP server exposing strongly-typed, read-only pfSense REST API tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
pfsense-mcp-server = "pfsense_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "respx>=0.21,<1.0",
]

[tool.pytest.ini_options]
markers = [
    "live: makes a real network call to a live pfSense instance; skipped unless PFSENSE_RUN_LIVE_TESTS=true is set explicitly.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfsense_mcp"]
