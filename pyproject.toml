[project]
name = "pfsense-mcp-server"
version = "0.6.0"
description = "Security-focused local MCP server exposing strongly typed READ tools for pfSense."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "pfsense", "networking", "firewall", "security", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
    "Typing :: Typed",
]
dependencies = [
    # The floor is a real, tested minimum, not an aspirational one -- see
    # scripts/verify_min_dependencies.py and the CI `min-deps` job.
    # Verified 2026-08-09: every mcp release from 1.0.0 through 1.21.0
    # either fails to import (mcp.server.fastmcp/mcp.types.ToolAnnotations
    # do not exist yet) or crashes on tool registration
    # (`TypeError: issubclass() arg 1 must be a class` inside mcp's own
    # `fastmcp/tools/base.py` when inspecting this project's parameter
    # annotations) -- 1.21.1 is the first version confirmed to actually
    # work end to end. mcp>=1.21.1 itself already declares
    # pydantic>=2.11.0/httpx>=0.27.1 as its own transitive floor, which is
    # why those two are left as originally declared below rather than
    # duplicated here -- any resolver satisfying mcp's own requirement
    # already satisfies them.
    "mcp>=1.21.1,<2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "cryptography>=43.0,<51.0",
]

[project.scripts]
pfsense-mcp-server = "pfsense_mcp.server:main"
pfsense-mcp-security = "pfsense_mcp.security_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "build>=1.2,<2.0",
    "hatchling>=1.25,<2.0",
    "pytest-cov>=5.0,<8.0",
    "bandit>=1.7,<2.0",
    "twine>=5.0,<7.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]

[project.urls]
Homepage = "https://github.com/night4me/pfsense-mcp-server"
Repository = "https://github.com/night4me/pfsense-mcp-server"
Issues = "https://github.com/night4me/pfsense-mcp-server/issues"
Changelog = "https://github.com/night4me/pfsense-mcp-server/blob/main/CHANGELOG.md"
Security = "https://github.com/night4me/pfsense-mcp-server/security/policy"
Documentation = "https://night4me.github.io/pfsense-mcp-server/"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
# lab/ is disposable-lab tooling (docs/tier1/specs/
# disposable_lab_execution_model.md) -- never collected by the default
# suite; run its offline tests explicitly via `pytest lab/`.
# witness_daemon/ is the separate, host-side TPM witness daemon
# (docs/tier1/specs/anti_rollback_tpm_host_witness.md) -- a different
# deployable entirely, never shipped in this package; run its offline
# tests explicitly via `pytest witness_daemon/`.
# signing/ is the separate, off-host, operator-only ADR-028 signing tool
# (W3 Slice 5) -- a different deployable entirely, never shipped in this
# package; run its offline tests explicitly via `pytest signing/`.
addopts = "--ignore=lab --ignore=witness_daemon --ignore=signing"
markers = [
    "live: makes a real network call to a live pfSense instance; skipped unless PFSENSE_RUN_LIVE_TESTS=true is set explicitly.",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# B (flake8-bugbear): catches real bug-prone patterns (mutable/call
# default arguments, overly broad `except`/`pytest.raises(Exception)`),
# not merely style -- added 2026-08-09 after an evidence-backed pass
# found and fixed 4 real instances (all in tests/), 0 false positives.
# SIM/RUF/C4 added 2026-08-09 after a second evidence-first pass: the
# broader UP (pyupgrade) rules were evaluated too (~132 findings across
# UP017/UP035/UP037) and deliberately NOT adopted -- purely cosmetic
# modernization at a scale that would be mass churn, not a coherent
# fix; see NEXT_TASKS.md for the exact reproduction command if ever
# revisited. SIM/RUF/C4 combined: 47 findings, every one individually
# reviewed (including two in Tier 1 safety-critical code, verified
# logically equivalent before combining), 0 introduced false positives
# except one deliberate homoglyph test fixture (tests/tier1/
# test_canonical.py), suppressed inline with a comment explaining why,
# not blanket-ignored -- RUF001 stays enabled to catch a real future
# accidental homoglyph anywhere else.
select = ["E", "F", "I", "B", "SIM", "RUF", "C4"]

[tool.mypy]
python_version = "3.11"
files = ["src/pfsense_mcp", "scripts", "lab"]
# Requires a module to declare intent (via __all__ or an explicit `as`
# re-import) before another module may import a name through it rather
# than its actual defining module -- added 2026-08-09 after an
# evidence-backed check found and fixed exactly one real instance
# (application.py importing ConfigurationError through config.py, which
# only re-exported it as a side effect of its own internal `from .errors
# import ConfigurationError`, not a declared public re-export) across all
# 183 configured source files, 0 false positives. A dedicated,
# order-of-magnitude larger evaluation of full `--strict` (93 errors, 11
# files, almost entirely missing annotations in lab/tests/) was not
# adopted this pass -- see NEXT_TASKS.md.
no_implicit_reexport = true
# Global-only per mypy's own runtime warning ("Per-module sections should
# only specify per-module flags") -- confirmed to add 0 findings anywhere
# in the configured scope before being adopted.
warn_redundant_casts = true

# Incremental strictness ratchet (2026-08-09): the production package is
# now clean under full --strict (143 files, verified after fixing the 3
# real findings --strict surfaced: an unvalidated `Any`-as-dict return in
# rest_api_client.py, an unvalidated `Any`-as-CanonicalValue return in
# tier1/executor.py, and one missing parameter annotation in
# tools/registry.py -- all genuine typing defects, not merely annotation
# gaps). Scoped to pfsense_mcp.* only, not scripts/lab, which still have
# ~92 findings (almost entirely missing test-function annotations in
# lab/tests/) -- a real, sized, deliberately deferred future candidate,
# not silently dropped; see NEXT_TASKS.md for the exact count and
# reproduction command.
#
# Deliberately spelled out as individual flags, NOT `strict = true`:
# confirmed empirically that setting the `strict` meta-flag inside a
# per-module override section silently leaked `disallow_untyped_defs`/
# `disallow_untyped_calls`-shaped checks into `lab/tests/` -- files that
# do not match `pfsense_mcp.*` at all -- adding ~89 unrelated errors
# there and breaking `make quick`'s mypy stage. Root cause confirmed via
# mypy's own runtime warning: `warn_redundant_casts` (one of `strict`'s
# constituent flags) is global-only and cannot be meaningfully
# per-module-scoped, and using the `strict` shorthand did not surface
# that warning the way spelling out the flags individually did. Do not
# collapse this back to `strict = true` without re-verifying the exact
# `mypy src/pfsense_mcp scripts lab` command stays clean.
[[tool.mypy.overrides]]
module = "pfsense_mcp.*"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.coverage.run]
branch = true
source = ["pfsense_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = [
    "tests",
    # Reviewed local-only tooling: subprocess calls use fixed argv with
    # shell=False; validate_junit parses only pytest's local report.
    "scripts/checkpoint.py",
    "scripts/git_identity_check.py",
    "scripts/git_report.py",
    "scripts/scaffold_capability.py",
    "scripts/security_scan.py",
    "scripts/validate_junit.py",
]

[tool.bandit.assert_used]
# These assertions narrow types after validate_tls_settings has enforced
# the AUTO/CA-file invariant; they are not runtime authorization checks.
skips = ["*/tls.py", "src/pfsense_mcp/tls.py"]

[build-system]
# Ceiling pinned below the release that switched Hatchling's default
# Core Metadata output from 2.4 to 2.5 -- the pinned twine<7.0 release
# does not yet accept 2.5 (see docs/PYPI_RELEASE.md's failure/rollback
# section). 1.31.0 is the known-good, directly-verified ceiling: an
# isolated build at that exact resolution was confirmed to emit
# Metadata-Version: 2.4.
requires = ["hatchling>=1.25,<1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfsense_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/docs/ACCEPTANCE_v0.2.1.md",
    "/docs/ACCEPTANCE_v0.2.2.md",
    "/docs/ACCEPTANCE_v0.3.0.md",
    "/docs/ACCEPTANCE_v0.3.1.md",
    "/docs/ACCEPTANCE_v0.4.0.md",
    "/docs/ACCEPTANCE_v0.4.1.md",
    "/docs/ACCEPTANCE_v0.4.2.md",
    "/docs/ACCEPTANCE_v0.5.0.md",
    "/docs/ACCEPTANCE_v0.5.1.md",
    "/docs/ACCEPTANCE_v0.6.0.md",
    "/docs/API.md",
    "/docs/PYPI_RELEASE.md",
    "/docs/RECOVERY_CONTRACT_SPEC.md",
    "/docs/RELEASE_CHECKLIST.md",
    "/docs/SECURITY_MODEL.md",
    "/docs/TIER1_ROADMAP.md",
    "/pyproject.toml",
]
