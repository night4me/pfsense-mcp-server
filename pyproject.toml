[project]
name = "pfsense-mcp-server"
version = "0.2.2"
description = "Security-focused local MCP server exposing strongly typed READ tools for pfSense."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "pfsense", "networking", "firewall", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
pfsense-mcp-server = "pfsense_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "build>=1.2,<2.0",
    "hatchling>=1.25,<2.0",
    "pytest-cov>=5.0,<8.0",
    "bandit>=1.7,<2.0",
    "twine>=5.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/night4me/pfsense-mcp-server"
Repository = "https://github.com/night4me/pfsense-mcp-server"
Issues = "https://github.com/night4me/pfsense-mcp-server/issues"
Changelog = "https://github.com/night4me/pfsense-mcp-server/blob/main/CHANGELOG.md"
Security = "https://github.com/night4me/pfsense-mcp-server/security/policy"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
markers = [
    "live: makes a real network call to a live pfSense instance; skipped unless PFSENSE_RUN_LIVE_TESTS=true is set explicitly.",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/pfsense_mcp", "scripts"]

[tool.coverage.run]
branch = true
source = ["pfsense_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = [
    "tests",
    # Reviewed local-only tooling: subprocess calls use fixed argv with
    # shell=False; validate_junit parses only pytest's local report.
    "scripts/checkpoint.py",
    "scripts/git_report.py",
    "scripts/scaffold_capability.py",
    "scripts/security_scan.py",
    "scripts/validate_junit.py",
]

[tool.bandit.assert_used]
# These assertions narrow types after validate_tls_settings has enforced
# the AUTO/CA-file invariant; they are not runtime authorization checks.
skips = ["*/tls.py", "src/pfsense_mcp/tls.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfsense_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/README.md",
    "/SECURITY.md",
    "/docs/ACCEPTANCE_v0.2.1.md",
    "/docs/API.md",
    "/docs/RELEASE_CHECKLIST.md",
    "/docs/SECURITY_MODEL.md",
    "/docs/TIER1_ROADMAP.md",
    "/pyproject.toml",
]
