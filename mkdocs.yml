          - Disposable-lab execution model: tier1/specs/disposable_lab_execution_model.md
  - Release and contributing:
      - Release checklist: RELEASE_CHECKLIST.md
      - Public launch checklist: PUBLIC_LAUNCH_CHECKLIST.md
      - PyPI release procedure: PYPI_RELEASE.md
      - Dependency policy: DEPENDENCY_POLICY.md
      - Benchmark methodology: BENCHMARKS.md
      - Contributing (GitHub): https://github.com/night4me/pfsense-mcp-server/blob/main/CONTRIBUTING.md
      - Support (GitHub): https://github.com/night4me/pfsense-mcp-server/blob/main/SUPPORT.md
      - READ backlog (historical): READ_BACKLOG.md
  - Acceptance records:
      - v0.1.0: ACCEPTANCE_v0.1.0.md
      - v0.2.0: ACCEPTANCE_v0.2.0.md
