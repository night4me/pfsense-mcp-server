name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install in a clean environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m ruff check .
      - name: mypy
        run: .venv/bin/python -m mypy src/pfsense_mcp scripts
      - name: Complete offline pytest suite
        run: .venv/bin/python -m pytest -q
      - name: Architecture checks
        run: make quick

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Branch coverage
        run: make coverage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.2,<2.0'
          python -m build --sdist --wheel
      - name: Inspect distribution members
        run: python scripts/verify_distribution.py dist
      - name: Install wheel and verify fail-closed entry point
        run: |
          clean_env="$(mktemp -d)"
          trap 'rm -rf "$clean_env"' EXIT
          python -m venv "$clean_env/venv"
          "$clean_env/venv/bin/python" -m pip install --quiet dist/*.whl
          "$clean_env/venv/bin/python" -c "import pfsense_mcp.server"
          if "$clean_env/venv/bin/pfsense-mcp-server" >"$clean_env/stdout" 2>"$clean_env/stderr"; then
            exit 1
          fi
          grep -q "configuration error" "$clean_env/stderr"
          ! grep -q "Traceback" "$clean_env/stderr"

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Python static security analysis
        run: make security-static
