name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install in a clean environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m ruff check .
      - name: mypy
        run: .venv/bin/python -m mypy src/pfsense_mcp scripts witness_daemon
      # `make quick`'s own [4/11] stage runs the complete pytest suite
      # (now xdist-accelerated) -- a standalone pytest step here would be a
      # second, redundant full-suite run in the same environment/SHA.
      - name: Architecture checks
        run: make quick

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Branch coverage
        run: make coverage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.2,<2.0'
          python -m build --sdist --wheel
      - name: Inspect distribution members
        run: python scripts/verify_distribution.py dist
      - name: Install wheel and verify fail-closed entry point
        run: |
          clean_env="$(mktemp -d)"
          trap 'rm -rf "$clean_env"' EXIT
          python -m venv "$clean_env/venv"
          "$clean_env/venv/bin/python" -m pip install --quiet dist/*.whl
          "$clean_env/venv/bin/python" -c "import pfsense_mcp.server"
          if "$clean_env/venv/bin/pfsense-mcp-server" >"$clean_env/stdout" 2>"$clean_env/stderr"; then
            exit 1
          fi
          grep -q "configuration error" "$clean_env/stderr"
          ! grep -q "Traceback" "$clean_env/stderr"

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Python static security analysis
        run: make security-static

  witness-daemon:
    # witness_daemon/ is the separate, host-side TPM witness daemon
    # (docs/tier1/specs/anti_rollback_tpm_host_witness.md) -- excluded
    # from the default pytest collection (a different deployable
    # entirely, never shipped in this package), but real and tested;
    # this job runs its own suite explicitly on every push so it cannot
    # silently rot, unlike lab/ (dev-only tooling, deliberately not
    # CI-wired).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: witness_daemon test suite
        run: make witness-daemon-check

  min-deps:
    # Verifies the dependency floors declared in pyproject.toml are real,
    # not aspirational: installs at `--resolution=lowest-direct` and runs
    # the full offline test suite against that install. Added 2026-08-09
    # after the previously-declared `mcp>=1.0.0` floor was found to be
    # false -- every mcp release from 1.0.0 through 1.21.0 either fails to
    # import or crashes on tool registration; see
    # scripts/verify_min_dependencies.py for the full history and
    # scripts/verify_min_dependencies.py's own docstring for exactly how
    # this was discovered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade pip 'uv>=0.4,<1.0'
      - name: Verify minimum dependency versions
        run: python scripts/verify_min_dependencies.py

  release-state:
    # Three standalone, offline, stdlib-only scripts whose *internal
    # logic* is already exercised by the full pytest suite (the `test`
    # job's `make quick`, via their own dedicated unit tests), but whose
    # *end-to-end invocation against this exact commit's real
    # repository state* was never independently run in CI before this
    # job (found during the v1.0.0 Phase 2 hardening audit, H2) -- a
    # unit-tested checker whose own script never actually runs against
    # real HEAD state can drift silently without anything noticing.
    # `release_state_check.py` in particular is the exact category of
    # check that would have caught the original v0.8.0 tag-visibility
    # incident before it happened, had it existed then; `fetch-depth: 0`
    # here is required for its own tag-reachability check, matching the
    # same pattern already used by the `test`/`coverage`/`min-deps` jobs
    # above. No dependency install is needed: all three scripts import
    # only the standard library plus this repository's own `scripts/lib/`
    # modules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Release-state consistency
        run: python scripts/release_state_check.py
      - name: Documentation consistency
        run: python scripts/validate_docs.py
      - name: Fixture safety
        run: python scripts/fixture_safety.py

  docs:
    # Builds the documentation site to prove it stays buildable --
    # never deploys anything. Enabling a public GitHub Pages deployment
    # is a separate, explicit owner decision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[docs]"
      - name: Build documentation site (strict)
        run: .venv/bin/python -m mkdocs build --strict

  dependency-review:
    # Only meaningful on a pull request (compares base ref vs. head
    # ref) -- fails the check if a newly introduced dependency has a
    # known vulnerability or a license outside the allowed set. Uses
    # this repository's default-enabled Dependency Graph; does not
    # itself require SARIF/Code Scanning (unlike CodeQL -- see
    # codeql.yml, which now uploads SARIF since this repository is
    # public and that costs nothing).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0
