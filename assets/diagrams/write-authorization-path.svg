<g><rect x="92.0" y="20.0" width="320.0" height="72.0" rx="6" fill="#f8d7da" stroke="#842029" stroke-width="1.5"/><text x="252.0" y="46.0" text-anchor="middle" dominant-baseline="middle">Default profile: 0 WRITE tools</text><text x="252.0" y="66.0" text-anchor="middle" dominant-baseline="middle">(not reachable)</text></g><line x1="252.0" y1="92.0" x2="252.0" y2="138.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/><g><rect x="188.4" y="95.0" width="127.1" height="40.0" rx="3" fill="#e8e8e8"/><text x="252.0" y="108.0" text-anchor="middle" dominant-baseline="middle" class="edge-label">explicit operator</text><text x="252.0" y="122.0" text-anchor="middle" dominant-baseline="middle" class="edge-label">opt-in required</text></g><g><rect x="92.0" y="138.0" width="320.0" height="72.0" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/><text x="252.0" y="164.0" text-anchor="middle" dominant-baseline="middle">write_protected profile + full</text><text x="252.0" y="184.0" text-anchor="middle" dominant-baseline="middle">Tier 1 material provisioned</text></g><line x1="252.0" y1="210.0" x2="252.0" y2="256.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/><g><rect x="92.0" y="256.0" width="320.0" height="92.0" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/><text x="252.0" y="282.0" text-anchor="middle" dominant-baseline="middle">Off-host signed authorization</text><text x="252.0" y="302.0" text-anchor="middle" dominant-baseline="middle">+ confirmation (separate</text><text x="252.0" y="322.0" text-anchor="middle" dominant-baseline="middle">identities)</text></g><line x1="252.0" y1="348.0" x2="252.0" y2="394.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/><g><rect x="92.0" y="394.0" width="320.0" height="92.0" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/><text x="252.0" y="420.0" text-anchor="middle" dominant-baseline="middle">6 fail-closed gates</text><text x="252.0" y="440.0" text-anchor="middle" dominant-baseline="middle">(signature, expiry, digest,</text><text x="252.0" y="460.0" text-anchor="middle" dominant-baseline="middle">freshness, one-time use)</text></g><line x1="252.0" y1="486.0" x2="252.0" y2="532.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/><g><rect x="92.0" y="532.0" width="320.0" height="72.0" rx="6" fill="#cfe2ff" stroke="#084298" stroke-width="1.5"/><text x="252.0" y="558.0" text-anchor="middle" dominant-baseline="middle">Sealed MutationExecutor (only</text><text x="252.0" y="578.0" text-anchor="middle" dominant-baseline="middle">path that ever sends)</text></g><line x1="252.0" y1="604.0" x2="252.0" y2="650.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/><g><rect x="92.0" y="650.0" width="320.0" height="52.0" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/><text x="252.0" y="676.0" text-anchor="middle" dominant-baseline="middle">Authoritative read-back</text></g><line x1="252.0" y1="702.0" x2="252.0" y2="748.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/><g><polygon points="252.0,748.0 468.0,786.0 252.0,824.0 36.0,786.0" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/><text x="252.0" y="786.0" text-anchor="middle" dominant-baseline="middle">Outcome?</text></g><line x1="252.0" y1="824.0" x2="80.0" y2="870.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="252.0" y1="824.0" x2="324.0" y2="870.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/><g><rect x="127.7" y="834.0" width="76.7" height="26.0" rx="3" fill="#e8e8e8"/><text x="166.0" y="847.0" text-anchor="middle" dominant-baseline="middle" class="edge-label">confirmed</text></g><g><rect x="249.7" y="834.0" width="76.7" height="26.0" rx="3" fill="#e8e8e8"/><text x="288.0" y="847.0" text-anchor="middle" dominant-baseline="middle" class="edge-label">ambiguous</text></g><g><rect x="20.0" y="870.0" width="120.0" height="52.0" rx="6" fill="#d1e7dd" stroke="#0f5132" stroke-width="1.5"/><text x="80.0" y="896.0" text-anchor="middle" dominant-baseline="middle">VERIFIED</text></g><g><rect x="164.0" y="870.0" width="320.0" height="72.0" rx="6" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/><text x="324.0" y="896.0" text-anchor="middle" dominant-baseline="middle">RECONCILIATION (never blind</text><text x="324.0" y="916.0" text-anchor="middle" dominant-baseline="middle">retry)</text></g></g></svg>
