<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="pfsenseMcpIconTitle">
  <title id="pfsenseMcpIconTitle">pfsense-mcp-server "Network Shield" symbol</title>
  <defs>
    <linearGradient id="shieldGradient" x1="30" y1="10" x2="170" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#06B6D4" />
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M100 10
               C70 10, 40 22, 25 40
               C25 95, 30 140, 50 162
               C65 180, 82 190, 100 196
               C118 190, 135 180, 150 162
               C170 140, 175 95, 175 40
               C160 22, 130 10, 100 10
               Z" />
    </clipPath>
  </defs>

  <!-- Shield outline, filled with the primary blue to cyan gradient -->
  <path d="M100 10
           C70 10, 40 22, 25 40
           C25 95, 30 140, 50 162
           C65 180, 82 190, 100 196
           C118 190, 135 180, 150 162
           C170 140, 175 95, 175 40
           C160 22, 130 10, 100 10
           Z"
        fill="url(#shieldGradient)" />

  <!-- Everything below is clipped to the shield silhouette. -->
  <g clip-path="url(#shieldClip)">
    <!-- Network-node motif: one hub connected to two children, upper
         portion of the shield, representing MCP's connected-tool
         model. -->
    <g stroke="#F1F5F9" stroke-width="3.5" fill="none" opacity="0.95">
      <line x1="100" y1="55" x2="80" y2="76" />
      <line x1="100" y1="55" x2="120" y2="76" />
      <line x1="100" y1="55" x2="100" y2="80" />
    </g>
    <g fill="#F1F5F9">
      <circle cx="100" cy="55" r="7" />
      <circle cx="80" cy="76" r="5.5" />
      <circle cx="120" cy="76" r="5.5" />
      <circle cx="100" cy="80" r="5.5" />
    </g>

    <!-- Firewall brick-wall motif, lower portion, running-bond
         pattern, three rows, representing the firewall the server
         protects access to. -->
    <g fill="#0B1220" opacity="0.92">
      <rect x="35" y="118" width="26" height="12" rx="1.5" />
      <rect x="65" y="118" width="26" height="12" rx="1.5" />
      <rect x="95" y="118" width="26" height="12" rx="1.5" />
      <rect x="125" y="118" width="26" height="12" rx="1.5" />

      <rect x="20" y="134" width="26" height="12" rx="1.5" />
      <rect x="50" y="134" width="26" height="12" rx="1.5" />
      <rect x="80" y="134" width="26" height="12" rx="1.5" />
      <rect x="110" y="134" width="26" height="12" rx="1.5" />
      <rect x="140" y="134" width="26" height="12" rx="1.5" />

      <rect x="35" y="150" width="26" height="12" rx="1.5" />
      <rect x="65" y="150" width="26" height="12" rx="1.5" />
      <rect x="95" y="150" width="26" height="12" rx="1.5" />
      <rect x="125" y="150" width="26" height="12" rx="1.5" />
    </g>
  </g>
</svg>
